<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澎湖旅遊規劃器 — 後台管理</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div>
    <a class="nav-brand" href="/">🌊 澎湖旅遊規劃器</a>
    <div class="nav-subtitle">潮旅國際旅行社｜交觀乙第1864號｜澎品保第0188號</div>
  </div>
  <div class="nav-links">
    <a href="/" id="nav-planner">📝 規劃行程</a>
    <a href="/trips" id="nav-trips">📋 所有報價</a>
    <a href="/admin" id="nav-admin">⚙️ 後台管理</a>
  </div>
</nav>

<div class="page">
  <div class="page-title">⚙️ 後台資料管理</div>
  <p class="text-muted" style="margin-bottom:20px">管理景點、餐廳、交通、住宿的固定選單，可新增、編輯或停用項目。</p>

  <div id="admin-tab-bar" class="admin-tabs"></div>
  <div class="card">
    <div id="admin-content">
      <div style="text-align:center;padding:40px;color:var(--muted)">載入中…</div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">新增項目</div>
    <form id="modal-form" onsubmit="return false"></form>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmModal()">儲存</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
