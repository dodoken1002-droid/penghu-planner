<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — 澎湖旅遊規畫器</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#0077B6 0%,#00B4D8 100%); }
  .login-box { background:white; border-radius:16px; padding:40px 36px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .login-logo { text-align:center; margin-bottom:28px; }
  .login-logo .icon { font-size:2.8rem; }
  .login-logo h1 { font-size:1.3rem; font-weight:700; color:var(--ocean); margin-top:8px; }
  .login-logo p { font-size:0.78rem; color:var(--muted); margin-top:4px; }
  .login-error { background:#fde8e8; color:#a93226; border-radius:8px; padding:10px 14px; font-size:0.87rem; margin-bottom:14px; display:none; }
  .login-btn { width:100%; padding:12px; font-size:1rem; margin-top:8px; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="icon">🌊</div>
    <h1>澎湖旅遊規畫器</h1>
    <p>潮旅國際旅行社｜交觀乙第1864號｜澎品保第0188號</p>
  </div>

  <div class="login-error" id="login-error"></div>

  <form onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label">帳號</label>
      <input id="username" class="form-control" placeholder="輸入帳號" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">密碼</label>
      <input id="password" class="form-control" type="password" placeholder="輸入密碼" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary login-btn" id="login-btn">登入</button>
  </form>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = '登入中…';
  errEl.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登入失敗');

    // Redirect based on role
    const redirectMap = { admin: '/', editor: '/admin', viewer: '/trips' };
    location.href = redirectMap[data.role] || '/';
  } catch (e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '登入';
  }
}
</script>
</body>
</html>
