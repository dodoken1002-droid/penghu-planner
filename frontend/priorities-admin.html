<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澎湖議題調查｜管理後台</title><style>body{font-family:system-ui,sans-serif;background:#f5f5ed;color:#1c3440;max-width:850px;margin:auto;padding:24px;line-height:1.6}h1{font-size:2rem}.card{background:white;border:1px solid #d4e0d9;border-radius:16px;padding:20px;margin:20px 0}li{padding:5px}small{color:#60716c}</style></head><body><h1>澎湖議題調查後台</h1><p>僅顯示彙總數據。公開問卷為自願參與，無法確認一人一票或代表全體縣民。</p><div class="card"><h2>回覆數</h2><p id="count">載入中…</p></div><div class="card"><h2>議題優先順序</h2><ol id="issues"></ol><small>第一至第五名依序為 5 至 1 分。</small></div><div class="card"><h2>年齡區間</h2><ul id="ages"></ul><h2>性別</h2><ul id="genders"></ul><small>不願透露亦計入分類。較早期提交的回覆可能未填寫基本資料，因此分類總數不一定等於回覆總數。</small></div><div class="card"><h2>參選人政見</h2><p>政見作答與統計功能尚未完成。</p></div><script>
function addList(id,entries){const ul=document.getElementById(id);ul.replaceChildren();if(!entries.length){ul.textContent='目前沒有資料。';return}for(const text of entries){const li=document.createElement('li');li.textContent=text;ul.append(li)}}
fetch('/api/priorities/admin/summary',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('count').textContent=d.count+' 份';addList('issues',d.count?d.issues.map(x=>`${x.name}：${x.points} 分，${x.first} 人列為第一`):[]);addList('ages',Object.entries(d.ages).map(([k,v])=>`${k}：${v} 人`));addList('genders',Object.entries(d.genders).map(([k,v])=>`${k}：${v} 人`))}).catch(()=>{document.getElementById('count').textContent='資料載入失敗，請重新整理。'});
</script></body></html>
