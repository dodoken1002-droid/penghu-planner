

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澎湖旅遊規劃器 — 所有報價</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div>
    <a class="nav-brand" href="/">🌊 澎湖旅遊規劃器</a>
    <div class="nav-subtitle">潮旅國際旅行社｜交觀乙第1864號｜澎品保第0188號</div>
  </div>
  <div class="nav-links">
    <a href="/" id="nav-planner">📝 規劃行程</a>
    <a href="/trips" id="nav-trips">📋 所有報價</a>
    <a href="/admin" id="nav-admin">⚙️ 後台管理</a>
  </div>
</nav>

<div class="page">
  <div class="flex-between" style="margin-bottom:20px">
    <div class="page-title" style="margin:0">📋 所有報價紀錄</div>
    <a href="/" class="btn btn-primary">＋ 規劃新行程</a>
  </div>

  <!-- Stats row -->
  <div class="grid-4" style="margin-bottom:20px" id="stats-row">
    <div class="card" style="text-align:center;padding:16px">
      <div style="font-size:1.8rem;font-weight:700;color:var(--ocean)" id="stat-total">0</div>
      <div class="text-muted">全部行程</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
      <div style="font-size:1.8rem;font-weight:700;color:var(--warning)" id="stat-quoting">0</div>
      <div class="text-muted">報價中</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
      <div style="font-size:1.8rem;font-weight:700;color:var(--success)" id="stat-confirmed">0</div>
      <div class="text-muted">已確認</div>
    </div>
    <div class="card" style="text-align:center;padding:16px">
      <div style="font-size:1.8rem;font-weight:700;color:var(--ocean)" id="stat-revenue">$0</div>
      <div class="text-muted">確認總金額</div>
    </div>
  </div>

  <div class="card">
    <!-- Filter bar -->
    <div class="flex gap-2" style="margin-bottom:16px;flex-wrap:wrap">
      <input id="search-input" class="form-control" placeholder="🔍 搜尋客戶姓名或電話..." style="max-width:280px">
      <select id="filter-status" class="form-control" style="max-width:140px">
        <option value="">全部狀態</option>
        <option value="草稿">草稿</option>
        <option value="報價中">報價中</option>
        <option value="確認">確認</option>
        <option value="取消">取消</option>
      </select>
      <select id="filter-booking" class="form-control" style="max-width:170px">
        <option value="">全部出團確認</option>
        <option value="pending">待確認</option>
        <option value="partial">部分完成</option>
        <option value="complete">全部完成</option>
      </select>
    </div>

    <div style="overflow-x:auto">
      <table class="trips-table">
        <thead>
          <tr>
            <th>#</th>
            <th>客戶</th>
            <th>出發日期</th>
            <th>行程</th>
            <th>人數</th>
            <th>成本</th>
            <th>報價</th>
            <th>出團確認</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="trips-tbody">
          <tr><td colspan="10" style="text-align:center;padding:40px;color:var(--muted)">載入中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="booking-modal-overlay">
  <div class="modal booking-check-modal">
    <div class="modal-title">✅ 出團前預訂確認</div>
    <div class="booking-trip-label" id="booking-trip-label"></div>
    <p class="booking-help">請逐項確認供應商已完成預訂；備註可填寫訂位編號、聯絡窗口或待處理事項。</p>
    <div id="booking-check-list"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeBookingChecklist()">取消</button>
      <button class="btn btn-primary" id="save-booking-checks" onclick="saveBookingChecklist()">儲存確認進度</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/trips.js"></script>
<script src="/js/group-import.js"></script>
</body>
</html>
